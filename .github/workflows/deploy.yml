name: Deploy to production server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            echo "🚀 Deploying Numerologist on $HOSTNAME"

            APP=/var/www/numerologist
            cd "$APP"

            echo "📥 Syncing main while preserving the server-only commit..."
            sudo -u www-data git -c safe.directory="$APP" fetch origin main
            sudo -u www-data git -c safe.directory="$APP" rebase origin/main

            echo "⚙️  Running Django checks, migrations and static collection..."
            sudo -u www-data "$APP/.venv/bin/python" manage.py check
            sudo -u www-data "$APP/.venv/bin/python" manage.py migrate --noinput
            sudo -u www-data "$APP/.venv/bin/python" manage.py collectstatic --noinput

            echo "🔄 Restarting Numerologist..."
            sudo systemctl restart numerologist.service
            sudo systemctl is-active --quiet numerologist.service

            echo "✅ Numerologist deployment complete"
